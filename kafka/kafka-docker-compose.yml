services:
  kafka:
    image: apache/kafka:4.0.0
    container_name: bt_kafka
    ports:
      - "19092:19092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "controller,broker"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"

      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093"

      # 如需从外部访问kafka, 可根据实际部署的服务器地址修改此处的 KAFKA_EXTERNAL_ADDR 环境变量
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:9092,EXTERNAL://localhost:19092"

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"

      # Kafka 数据目录落到挂载目录（关键）
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      KAFKA_METADATA_LOG_DIR: "/var/lib/kafka/data"

      # 单节点必须是 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"

      # 开发期可选：自动建 topic
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

      KAFKA_HEAP_OPTS: "-Xms1g -Xmx1g" # 设置 Kafka 使用 1GB 内存堆
      KAFKA_OFFSETS_RETENTION_MINUTES: "10080" #多保留“消费者组的 offset（消费位点）数据 10080 分钟”，也就是 7 天

      KAFKA_LOG_RETENTION_HOURS: "168"
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: "300000"
      KAFKA_LOG_SEGMENT_BYTES: "1073741824"

    # 用 tmpfs 做数据目录，重启就清空，不占磁盘
    tmpfs:
      - /var/lib/kafka/data:rw,mode=1777,size=1073741824 #大小1GB
    networks:
      - kafka-net
      #- bt_nms_bt_nms_network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 60
    restart: unless-stopped

networks:
  kafka-net:
    driver: bridge
    name: kafka_kafka-net
  #bt_nms_bt_nms_network:
  #  external: true