server {
  listen 8080;
  server_name localhost;
  server_tokens off;

  resolver 127.0.0.11 valid=10s ipv6=off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Vue 构建后的静态资源目录
  root /usr/share/nginx/html;
  index index.html;

  # Static assets should fail as real 404s. Falling them back to index.html
  # makes broken builds look like "unstyled text" in the browser.
  location /assets/ {
    try_files $uri =404;
  }

  location /audio/ {
    try_files $uri =404;
  }

  location = /favicon.ico {
    try_files $uri =404;
  }

  location /bt-api/ {
    set $upstream http://bt-backend-gateway:8000;
    rewrite ^/bt-api(/.*)$ /api$1 break;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /sy-api/ {
    set $upstream http://sy-backend-gateway:8000;
    rewrite ^/sy-api(/.*)$ /api$1 break;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /bt-ws/ {
    set $upstream http://bt-backend-gateway:8000;
    rewrite ^/bt-ws(/.*)$ /ws$1 break;
    proxy_pass $upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /sy-ws/ {
    set $upstream http://sy-backend-gateway:8000;
    rewrite ^/sy-ws(/.*)$ /ws$1 break;
    proxy_pass $upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /bt-admin {
    return 301 /bt-admin/;
  }

  location /bt-admin/ {
    set $upstream http://bt-backend-gateway:8000;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /sy-admin {
    return 301 /sy-admin/;
  }

  location /sy-admin/ {
    set $upstream http://sy-backend-gateway:8000;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /bt-static/ {
    set $upstream http://bt-backend-gateway:8000;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /sy-static/ {
    set $upstream http://sy-backend-gateway:8000;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # 前端 history 模式支持
  location / {
    try_files $uri $uri/ /index.html;
  }
}

server {
  listen 8443 ssl;
  server_name localhost;
  server_tokens off;

  resolver 127.0.0.11 valid=10s ipv6=off;

  ssl_certificate /etc/nginx/certs/bt_nms.crt;
  ssl_certificate_key /etc/nginx/certs/bt_nms.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers "ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256";
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;
  ssl_session_tickets off;

  # Redirect plain HTTP requests accidentally sent to the HTTPS port.
  error_page 497 =301 https://$http_host$request_uri;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  root /usr/share/nginx/html;
  index index.html;

  location /assets/ {
    try_files $uri =404;
  }

  location /audio/ {
