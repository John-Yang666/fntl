name: bt_nms_sy_prod

x-sy-django-image: &sy_django_image
  image: my_django:v5.2.15-py3.14-sy-prod
  build:
    context: ./sy_backend
    dockerfile: Dockerfile.prod

services:
  redis:
    image: redis:7.4.9-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    container_name: bt_nms_sy_redis0
    command:
      - redis-server
      - --appendonly
      - "no"
      - --databases
      - "3"
      - --maxmemory
      - 1000mb
      - --maxclients
      - "500"
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --tcp-backlog
      - "256"
    networks:
      - sy_nms_network
    tmpfs:
      - /data:rw,mode=1777,size=268435456
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis_stream:
    image: redis:7.4.9-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    container_name: bt_nms_sy_redis_stream0
    command:
      - redis-server
      - --appendonly
      - "no"
      - --databases
      - "3"
      - --maxmemory
      - 1000mb
      - --maxclients
      - "500"
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --tcp-backlog
      - "256"
    ports:
      - "127.0.0.1:36380:6379"
    tmpfs:
      - /data:rw,mode=1777,size=268435456
    networks:
      - sy_nms_network
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  db:
    image: bt_nms_postgres:16.14-bookworm-secure
    build:
      context: ./deploy/postgres
      dockerfile: Dockerfile
    container_name: bt_nms_sy_postgres_db0
    environment:
      - POSTGRES_DB=${DATABASE_NAME:-mydatabase}
      - POSTGRES_USER=${DATABASE_USER:-myuser}
      - POSTGRES_PASSWORD_FILE=/run/secrets/sy_database_password
    secrets:
      - sy_database_password
    volumes:
      - ${DATA_DIR:-/srv/bt_nms_data}/sy/postgres:/var/lib/postgresql/data
    networks:
      - sy_nms_network
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-myuser} -d ${DATABASE_NAME:-mydatabase}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  init-permissions:
    <<: *sy_django_image
    user: "0:0"
    command:
      - /bin/sh
      - -c
      - |
        mkdir -p /app/staticfiles /app/media /data/cleanup_exports
        chown -R 10001:10001 /app/staticfiles /app/media /data/cleanup_exports
    volumes:
      - static_data:/app/staticfiles
      - ${DATA_DIR:-/srv/bt_nms_data}/sy/media:/app/media
      - ${DATA_DIR:-/srv/bt_nms_data}/cleanup_exports:/data/cleanup_exports
    read_only: true
    network_mode: "none"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
    pids_limit: 64
    restart: "no"

  web:
    <<: *sy_django_image
    container_name: bt_nms_sy_django_app0
    user: "10001:10001"
    command: ["bash", "/app/entrypoint-prod.sh"]
    expose:
      - "8000"
    volumes:
      - static_data:/app/staticfiles
      - ./sy_backend/deploy_host_ip.txt:/app/deploy_host_ip.txt:ro
      - ${DATA_DIR:-/srv/bt_nms_data}/sy/media:/app/media
      - ${DATA_DIR:-/srv/bt_nms_data}/cleanup_exports:/data/cleanup_exports
    tmpfs:
      - /tmp:rw,mode=1777,size=268435456
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    secrets:
      - sy_django_secret_key
      - sy_database_password
    environment:
      - DEBUG=${DEBUG:-false}
      - PYTHONDONTWRITEBYTECODE=1
      - DJANGO_SETTINGS_MODULE=myproject.settings
      - DJANGO_STATIC_URL=/sy-static/
      - DJANGO_SECRET_KEY_FILE=/run/secrets/sy_django_secret_key
      - DJANGO_ALLOWED_HOSTS=${SY_DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,bt_nms_sy_django_app,bt_nms_sy_django_app0}
      - CORS_ALLOWED_ORIGINS=${SY_CORS_ALLOWED_ORIGINS:-http://localhost:38173,http://127.0.0.1:38173,https://localhost:38443,https://127.0.0.1:38443}
      - DATA_DIR=/data
      - CLEANUP_EXPORT_DISPLAY_DIR=${DATA_DIR:-/srv/bt_nms_data}/cleanup_exports
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - STREAM_REDIS_HOST=redis_stream
      - STREAM_REDIS_PORT=6379
      - DATABASE_NAME=${DATABASE_NAME:-mydatabase}
      - DATABASE_USER=${DATABASE_USER:-myuser}
      - DATABASE_PASSWORD_FILE=/run/secrets/sy_database_password
      - DATABASE_HOST=${DATABASE_HOST:-db}
      - DATABASE_PORT=${DATABASE_PORT:-5432}
      - DJANGO_SUPERUSER_USERNAME=${SY_DJANGO_SUPERUSER_USERNAME:-}
      - DJANGO_SUPERUSER_EMAIL=${SY_DJANGO_SUPERUSER_EMAIL:-}
      - DJANGO_SUPERUSER_PASSWORD=${SY_DJANGO_SUPERUSER_PASSWORD:-}
      - DJANGO_SUPERUSER_PASSWORD_FILE=${SY_DJANGO_SUPERUSER_PASSWORD_FILE:-}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - SY_STREAM_DB=0
      - SY_CMD_STREAM=sy-serial-commands
      - SY_CMD_STREAM_MAXLEN=200000
      - UDP_STREAM_DB=0
      - UDP_COMMAND_STREAM=udp-commands
      - UDP_COMMAND_STREAM_MAXLEN=200000
    depends_on:
      init-permissions:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      redis_stream:
        condition: service_healthy
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/admin/', timeout=2); print('ok')\" || exit 1"
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - sy_nms_network
    restart: unless-stopped

  nginx:
    image: nginxinc/nginx-unprivileged:1.31.2-alpine3.23@sha256:054e14f543eb688809d59ec2ad1644d1a61678e247c87a318ad605977eb37eaf
    container_name: bt_nms_sy_nginx0
    user: "101:101"
    volumes:
      - static_data:/staticfiles:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,mode=1777,size=134217728
      - /var/run:rw,mode=1777,size=16777216
      - /tmp:rw,mode=1777,size=134217728
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    depends_on:
      web:
        condition: service_healthy
    command: >
      /bin/sh -c "
      until nc -z web 8000; do
        echo '[nginx] waiting for web:8000...';
        sleep 1;
      done;
      echo '[nginx] web is up, starting nginx...';
      nginx -g 'daemon off;'
      "
    networks:
      sy_nms_network:
      frontend_proxy:
        aliases:
          - sy-backend-gateway
    restart: unless-stopped

  sy_receiver:
    <<: *sy_django_image
    container_name: bt_nms_sy_receiver0
    user: "10001:10001"
    command: python sy_receiver.py
    tmpfs:
      - /tmp:rw,mode=1777,size=268435456
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    secrets:
      - sy_django_secret_key
      - sy_database_password
    environment:
      - DEBUG=${DEBUG:-false}
      - PYTHONDONTWRITEBYTECODE=1
      - DJANGO_SETTINGS_MODULE=myproject.settings
      - DJANGO_SECRET_KEY_FILE=/run/secrets/sy_django_secret_key
      - DATABASE_NAME=${DATABASE_NAME:-mydatabase}
      - DATABASE_USER=${DATABASE_USER:-myuser}
      - DATABASE_PASSWORD_FILE=/run/secrets/sy_database_password
      - DATABASE_HOST=${DATABASE_HOST:-db}
      - DATABASE_PORT=${DATABASE_PORT:-5432}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - STREAM_REDIS_HOST=redis_stream
      - STREAM_REDIS_PORT=6379
      - SY_STREAM_DB=0
      - SY_RAW_STREAM=sy.raw
      - SY_RAW_GROUP=sy-receiver-0
      - SY_RAW_CONSUMER=sy-receiver-0
      - SY_RAW_READ_COUNT=200
      - SY_RAW_BLOCK_MS=1000
      - INGEST_BATCH_MS=200
      - INGEST_MAX_BATCH=500
      - INGEST_LOG_INTERVAL_SEC=1
      - A1_HEARTBEAT_SECONDS=60
      - PERIODIC_DEVICE_CACHE_REFRESH_INTERVAL=60
    depends_on:
      init-permissions:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      redis_stream:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - sy_nms_network
    restart: unless-stopped

  summarize_alarms_container:
    <<: *sy_django_image
    container_name: bt_nms_sy_summarize_alarms_container0
    user: "10001:10001"
    command: python sy_summarize_alarms_container.py
    working_dir: /app
    tmpfs:
      - /tmp:rw,mode=1777,size=268435456
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    secrets:
      - sy_django_secret_key
      - sy_database_password
    environment:
      - DEBUG=${DEBUG:-false}
      - PYTHONDONTWRITEBYTECODE=1
      - DJANGO_SETTINGS_MODULE=myproject.settings
      - DJANGO_SECRET_KEY_FILE=/run/secrets/sy_django_secret_key
      - DATABASE_NAME=${DATABASE_NAME:-mydatabase}
      - DATABASE_USER=${DATABASE_USER:-myuser}
      - DATABASE_PASSWORD_FILE=/run/secrets/sy_database_password
      - DATABASE_HOST=${DATABASE_HOST:-db}
      - DATABASE_PORT=${DATABASE_PORT:-5432}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SUMMARY_INTERVAL_SEC=1
      - SUMMARY_DEVICE_CACHE_REFRESH_SEC=30
    depends_on:
      init-permissions:
        condition: service_completed_successfully
      web:
        condition: service_healthy
    networks:
      - sy_nms_network
    restart: unless-stopped

  celery:
    <<: *sy_django_image
    container_name: bt_nms_sy_celery_worker0
    user: "10001:10001"
    command: celery -A myproject worker --loglevel=info --pool=threads --concurrency=2 --without-gossip --without-mingle --without-heartbeat
    volumes:
      - ${DATA_DIR:-/srv/bt_nms_data}/sy/media:/app/media
      - ${DATA_DIR:-/srv/bt_nms_data}/cleanup_exports:/data/cleanup_exports
    tmpfs:
      - /tmp:rw,mode=1777,size=268435456
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    secrets:
      - sy_django_secret_key
      - sy_database_password
    environment:
      - DEBUG=${DEBUG:-false}
      - PYTHONDONTWRITEBYTECODE=1
      - DJANGO_SETTINGS_MODULE=myproject.settings
      - DJANGO_SECRET_KEY_FILE=/run/secrets/sy_django_secret_key
      - DATA_DIR=/data
      - CLEANUP_EXPORT_DISPLAY_DIR=${DATA_DIR:-/srv/bt_nms_data}/cleanup_exports
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - DATABASE_NAME=${DATABASE_NAME:-mydatabase}
      - DATABASE_USER=${DATABASE_USER:-myuser}
      - DATABASE_PASSWORD_FILE=/run/secrets/sy_database_password
      - DATABASE_HOST=${DATABASE_HOST:-db}
      - DATABASE_PORT=${DATABASE_PORT:-5432}
    depends_on:
      init-permissions:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - sy_nms_network
    restart: unless-stopped

  celery-beat:
    <<: *sy_django_image
    container_name: bt_nms_sy_celery_beat0
    user: "10001:10001"
    command: celery -A myproject beat --loglevel=info
    volumes:
      - ${DATA_DIR:-/srv/bt_nms_data}/sy/media:/app/media
      - ${DATA_DIR:-/srv/bt_nms_data}/cleanup_exports:/data/cleanup_exports
    tmpfs:
      - /tmp:rw,mode=1777,size=268435456
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    secrets:
      - sy_django_secret_key
      - sy_database_password
    environment:
      - DEBUG=${DEBUG:-false}
      - PYTHONDONTWRITEBYTECODE=1
      - DJANGO_SETTINGS_MODULE=myproject.settings
      - DJANGO_SECRET_KEY_FILE=/run/secrets/sy_django_secret_key
      - DATA_DIR=/data
      - CLEANUP_EXPORT_DISPLAY_DIR=${DATA_DIR:-/srv/bt_nms_data}/cleanup_exports
      - CELERY_BROKER_URL=redis://redis:6379/0
      - DATABASE_NAME=${DATABASE_NAME:-mydatabase}
      - DATABASE_USER=${DATABASE_USER:-myuser}
      - DATABASE_PASSWORD_FILE=/run/secrets/sy_database_password
      - DATABASE_HOST=${DATABASE_HOST:-db}
      - DATABASE_PORT=${DATABASE_PORT:-5432}
    depends_on:
      init-permissions:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - sy_nms_network
    restart: unless-stopped

  flower:
    profiles: ["observability"]
    image: bt_nms_flower:2.0.1-py3.14-slim
    build:
      context: ./deploy/flower
      dockerfile: Dockerfile
    container_name: bt_nms_sy_flower0
    ports:
      - "127.0.0.1:5556:5555"
    read_only: true
    tmpfs:
      - /tmp:rw,mode=1777,size=67108864
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - FLOWER_BASIC_AUTH=${SY_FLOWER_BASIC_AUTH:-}
    depends_on:
      - redis
      - celery
    networks:
      - sy_nms_network

  portainer:
    profiles: ["docker-admin"]
    image: portainer/portainer-ce:2.39.3-alpine@sha256:90ae993781c08a4dcd1f96c6547a072bb3f90b7ebd5e082d071ef1ad8a341373
    container_name: bt_nms_sy_portainer0
    ports:
      - "127.0.0.1:9001:9000"
    volumes:
      - ${DOCKER_HOST_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - ${DATA_DIR:-/srv/bt_nms_data}/sy/portainer:/data
    networks:
      - sy_nms_network
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    restart: "no"

secrets:
  sy_database_password:
    file: ${SY_DATABASE_PASSWORD_SECRET_FILE:-./deploy/secrets/sy_database_password}
  sy_django_secret_key:
    file: ${SY_DJANGO_SECRET_KEY_SECRET_FILE:-./deploy/secrets/sy_django_secret_key}

networks:
  sy_nms_network:
    driver: bridge
  frontend_proxy:
    external: true
    name: bt_nms_frontend_proxy

volumes:
  static_data:
