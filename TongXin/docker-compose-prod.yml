version: "2.1"

services:
  redis:
    image: redis:7.4.1
    security_opt:
      - seccomp:unconfined
    container_name: bt_nms_redis0
    command:
      - redis-server
      - --appendonly
      - "no"
      - --databases
      - "3"
      - --maxmemory
      - 1000mb
      - --maxclients
      - "500"
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --tcp-backlog
      - "256"
    networks:
      - bt_nms_network
    tmpfs:
      - /data:rw,mode=1777,size=268435456
    restart: unless-stopped

  redis_stream:
    image: redis:7.4.1
    security_opt:
      - seccomp:unconfined
    container_name: bt_nms_redis_stream0
    command:
      - redis-server
      - --appendonly
      - "no"
      - --save
      - ""
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
      - --databases
      - "3"
      - --tcp-backlog
      - "256"
      - --maxclients
      - "500"
    ports:
      - "36379:6379"
    tmpfs:
      - /data:rw,mode=1777,size=268435456
    networks:
      - msgbus-net
    restart: unless-stopped

  db:
    image: postgres:16.3
    security_opt:
      - seccomp:unconfined
    container_name: bt_nms_postgres_db0
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - ${DATA_DIR}/postgres:/var/lib/postgresql/data
    networks:
      - bt_nms_network
    restart: unless-stopped

  web:
    image: my_django:v5.0.6-prod
    security_opt:
      - seccomp:unconfined
    container_name: bt_nms_django_app0
    command: ["bash", "/app/entrypoint-prod.sh"]
    expose:
      - "8000"
    volumes:
      - ./backend:/app
      - static_data:/app/staticfiles
    tmpfs:
      - /tmp:rw,mode=1777,size=268435256
    environment:
      DEBUG: ${DEBUG}
      DJANGO_SETTINGS_MODULE: myproject.settings
      REDIS_HOST: redis
      REDIS_PORT: "6379"

      DJANGO_SUPERUSER_USERNAME: admin
      DJANGO_SUPERUSER_EMAIL: admin@example.com
      DJANGO_SUPERUSER_PASSWORD: admin

      MSG_BUS_BACKEND: redis
      REDIS_STREAM_HOST: redis_stream
      REDIS_STREAM_PORT: "6379"
      REDIS_STREAM_MAXLEN: "100000"
      REDIS_PACKET_STREAM_KEY: stream:udp:packets
      REDIS_CMD_STREAM_KEY: stream:udp:cmd

      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_PORT: "${DATABASE_PORT}"
    depends_on:
      - redis
      - db
      - redis_stream
    networks:
      - bt_nms_network
      - msgbus-net
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: bt_nms_nginx0
    ports:
      - "8000:8000"
    volumes:
      - static_data:/staticfiles:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    tmpfs:
      - /var/cache/nginx:rw,mode=1777,size=134217728
      - /tmp:rw,mode=1777,size=134217728
    depends_on:
      - web
    networks:
      - bt_nms_network
    restart: unless-stopped

  udp_receiver:
    image: my_django:v5.0.6-prod
    security_opt:
      - seccomp:unconfined
    container_name: bt_nms_udp_receiver0
    command: python udp_receiver.py
    working_dir: /app
    volumes:
      - ./backend:/app
    tmpfs:
      - /tmp:rw,mode=1777,size=268435456
    environment:
      DEBUG: ${DEBUG}
      DJANGO_SETTINGS_MODULE: myproject.settings

      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CELERY_BROKER_URL: redis://redis:6379/0

      REDIS_STREAM_HOST: redis_stream
      REDIS_STREAM_PORT: "6379"
      REDIS_STREAM_BLOCK_MS: "2000"
      REDIS_STREAM_COUNT: "200"
      REDIS_STREAM_MAXLEN: "100000"
      INGEST_BATCH_MS: "200"
      INGEST_MAX_BATCH: "200"
      INGEST_LOG_INTERVAL_SEC: "1"

      REDIS_PACKET_STREAM_KEY: stream:udp:packets
      REDIS_PACKET_GROUP: udp-receiver-packet
      REDIS_PACKET_CONSUMER: udp-receiver-packet-0

      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_PORT: "${DATABASE_PORT}"
    depends_on:
      - redis
      - redis_stream
      - db
      - web
    networks:
      - bt_nms_network
      - msgbus-net
    restart: unless-stopped

  summarize_alarms_container:
    image: my_django:v5.0.6-prod
    security_opt:
      - seccomp:unconfined
    container_name: bt_nms_summarize_alarms_container0
    command: python summarize_alarms_container.py
    working_dir: /app
    volumes:
      - ./backend:/app
    tmpfs:
      - /tmp:rw,mode=1777,size=268435456
    environment:
      DEBUG: ${DEBUG}
      DJANGO_SETTINGS_MODULE: myproject.settings
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      SUMMARY_INTERVAL_SEC: "1.5"
      SUMMARY_DEVICE_CACHE_REFRESH_SEC: "30"

      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_PORT: "${DATABASE_PORT}"
    depends_on:
      - redis
      - db
      - web
    networks:
      - bt_nms_network
    restart: unless-stopped

  celery:
    image: my_django:v5.0.6-prod
    security_opt:
      - seccomp:unconfined
    container_name: bt_nms_celery_worker0
    command: celery -A myproject worker --loglevel=info --pool=threads --concurrency=2 --without-gossip --without-mingle --without-heartbeat
    working_dir: /app
    volumes:
      - ./backend:/app
    tmpfs:
      - /tmp:rw,mode=1777,size=268435456
    environment:
      DEBUG: ${DEBUG}
      DJANGO_SETTINGS_MODULE: myproject.settings

      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CELERY_BROKER_URL: redis://redis:6379/0

      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_PORT: "${DATABASE_PORT}"

      MSG_BUS_BACKEND: redis
      REDIS_STREAM_HOST: redis_stream
      REDIS_STREAM_PORT: "6379"
      REDIS_STREAM_MAXLEN: "100000"
      REDIS_PACKET_STREAM_KEY: stream:udp:packets
      REDIS_CMD_STREAM_KEY: stream:udp:cmd
    depends_on:
      - redis
      - redis_stream
      - db
      - web
    networks:
      - bt_nms_network
      - msgbus-net
    restart: unless-stopped

  celery-beat:
    image: my_django:v5.0.6-prod
    security_opt:
      - seccomp:unconfined
    container_name: bt_nms_celery_beat0
    command: celery -A myproject beat --loglevel=info
    working_dir: /app
    volumes:
      - ./backend:/app
    tmpfs:
      - /tmp:rw,mode=1777,size=268435456
    environment:
      DEBUG: ${DEBUG}
      DJANGO_SETTINGS_MODULE: myproject.settings

      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CELERY_BROKER_URL: redis://redis:6379/0

      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_PORT: "${DATABASE_PORT}"

      MSG_BUS_BACKEND: redis
      REDIS_STREAM_HOST: redis_stream
      REDIS_STREAM_PORT: "6379"
      REDIS_STREAM_MAXLEN: "100000"
      REDIS_PACKET_STREAM_KEY: stream:udp:packets
      REDIS_CMD_STREAM_KEY: stream:udp:cmd
    depends_on:
      - redis
      - redis_stream
      - db
      - web
    networks:
      - bt_nms_network
      - msgbus-net
    restart: unless-stopped

  vue:
    image: my_vue:prod
    container_name: bt_nms_vue_prod0
    ports:
      - "38173:80"
    depends_on:
      - web
    networks:
      - bt_nms_network
    restart: unless-stopped

  flower:
    image: mher/flower:latest
    container_name: bt_nms_flower0
    ports:
      - "5555:5555"
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      - redis
      - celery
    networks:
      - bt_nms_network
    restart: unless-stopped

  portainer:
    image: portainer/portainer-ce:latest
    container_name: bt_nms_portainer0
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DATA_DIR}/portainer:/data
    depends_on:
      - web
    networks:
      - bt_nms_network
    restart: unless-stopped

networks:
  bt_nms_network:
    driver: bridge
  msgbus-net:
    driver: bridge

volumes:
  static_data:
