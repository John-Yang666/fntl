server {
  listen 80;
  server_name localhost;

  root /usr/share/nginx/html;
  index index.html;

  location /assets/ {
    try_files $uri =404;
  }

  location /audio/ {
    try_files $uri =404;
  }

  location = /favicon.ico {
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Standalone Vue mode must not reference compose-only backend service names
  # such as "web"; the frontend build calls backend ports directly.
  location /api/ {
    return 503 "Vue is running standalone. Use the configured backend port directly.\n";
  }

  location /ws/ {
    return 503;
  }
}
