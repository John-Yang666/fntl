name: bt_nms

services:
  # =======================
  # 老 redis：给 Django/Celery 用（不动）
  # =======================
  redis:
    image: redis:7.4.9-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    container_name: bt_nms_redis
    command:
      - redis-server
      - --appendonly
      - "no"
      - --databases
      - "3"
      - --maxmemory
      - 100mb
      - --maxclients
      - "500"
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --tcp-backlog
      - "256"
    networks:
      - bt_nms_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # =======================
  # 新 redis_stream：替代 Kafka（只连 msgbus-net）
  # 不持久化 + tmpfs，尽量不写硬盘
  # =======================
  redis_stream:
    image: redis:7.4.9-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    container_name: bt_nms_redis_stream
    command:
      - redis-server
      - --appendonly
      - "no"
      - --save
      - ""
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
      - --databases
      - "3"
      - --tcp-backlog
      - "256"
      - --maxclients
      - "500"
    ports:
      - "36379:6379"   # 宿主机（udp_agent）连 127.0.0.1:36379
    tmpfs:
      - /data:rw,mode=1777,size=268435456
    networks:
      - msgbus-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  db:
    image: bt_nms_postgres:16.14-alpine-secure
    build:
      context: ./deploy/postgres
      dockerfile: Dockerfile
    container_name: bt_nms_postgres_db
    environment:
      - POSTGRES_DB=mydatabase
      - POSTGRES_USER=myuser
      - POSTGRES_PASSWORD=mypassword
    volumes:
      - bt_nms_postgres_data:/var/lib/postgresql/data
    networks:
      - bt_nms_network
    restart: unless-stopped

  # ============ Django (dev) ============
  web:
    image: my_django:v5.2.15-py3.14
    container_name: bt_nms_django_app
    command: ["/app/entrypoint.sh"]
    volumes:
      - ./backend:/app
      - ${DATA_DIR:-/srv/bt_nms_data}/cleanup_exports:/data/cleanup_exports
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - DEBUG=True
      - DJANGO_SETTINGS_MODULE=myproject.settings
      - DJANGO_STATIC_URL=/bt-static/
      - DATA_DIR=/data

      # Django/Celery 用老 redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379

      - DATABASE_NAME=mydatabase
      - DATABASE_USER=myuser
      - DATABASE_PASSWORD=mypassword
      - DATABASE_HOST=db
      - DATABASE_PORT=5432

      - DJANGO_SUPERUSER_USERNAME=admin
      - DJANGO_SUPERUSER_EMAIL=admin@example.com
      - DJANGO_SUPERUSER_PASSWORD=admin

      # ---- 消息总线（双 stream：packets/cmd）----
      # 让 views.py / udp_sender import 时就拿到正确配置
      - MSG_BUS_BACKEND=redis
      - REDIS_STREAM_HOST=redis_stream
      - REDIS_STREAM_PORT=6379
      - REDIS_PACKET_STREAM_KEY=stream:udp:packets
      - REDIS_CMD_STREAM_KEY=stream:udp:cmd
      - REDIS_STREAM_MAXLEN=200000
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_started
      redis_stream:
        condition: service_healthy
    networks:
      bt_nms_network:
      msgbus-net:
      frontend_proxy:
        aliases:
          - bt-backend-gateway
    restart: unless-stopped

  udp_receiver:
    image: my_django:v5.2.15-py3.14
    container_name: bt_nms_udp_receiver
    command: python udp_receiver.py
    working_dir: /app
    volumes:
      - ./backend:/app
    environment:
      - DEBUG=True
      - DJANGO_SETTINGS_MODULE=myproject.settings
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - DATABASE_NAME=mydatabase
      - DATABASE_USER=myuser
      - DATABASE_PASSWORD=mypassword
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - REDIS_STREAM_HOST=redis_stream
      - REDIS_STREAM_PORT=6379
      - REDIS_PACKET_STREAM_KEY=stream:udp:packets
      - REDIS_PACKET_GROUP=udp-receiver-packet
      - REDIS_PACKET_CONSUMER=udp-receiver-packet-0
      - REDIS_STREAM_BLOCK_MS=2000
      - REDIS_STREAM_COUNT=200
      - INGEST_BATCH_MS=200
      - INGEST_MAX_BATCH=500
      - INGEST_LOG_INTERVAL_SEC=1
    depends_on:
      redis:
        condition: service_healthy
      redis_stream:
        condition: service_healthy
      db:
        condition: service_started
    networks:
      - bt_nms_network
      - msgbus-net
    restart: unless-stopped

  summarize_alarms_container:
    #build:
    #  context: ./backend
    #  dockerfile: Dockerfile
    image: my_django:v5.2.15-py3.14
    container_name: bt_nms_summarize_alarms_container
    command: python summarize_alarms_container.py
    working_dir: /app
    volumes:
      - ./backend:/app
    environment:
      - DEBUG=True
      - DJANGO_SETTINGS_MODULE=myproject.settings
      - REDIS_HOST=redis
      - REDIS_PORT=6379

      - DATABASE_NAME=mydatabase
      - DATABASE_USER=myuser
      - DATABASE_PASSWORD=mypassword
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
    depends_on:
      web:
        condition: service_started
      redis:
        condition: service_healthy
      db:
        condition: service_started
    networks:
      - bt_nms_network
    restart: unless-stopped

  celery:
    #build:
    #  context: ./backend
    #  dockerfile: Dockerfile
    image: my_django:v5.2.15-py3.14
    container_name: bt_nms_celery_worker
    command: celery -A myproject worker --loglevel=info
    volumes:
      - ./backend:/app
      - ${DATA_DIR:-/srv/bt_nms_data}/cleanup_exports:/data/cleanup_exports
    environment:
      - DEBUG=True
      - DJANGO_SETTINGS_MODULE=myproject.settings
      - DATA_DIR=/data

      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/0

      - DATABASE_NAME=mydatabase
      - DATABASE_USER=myuser
      - DATABASE_PASSWORD=mypassword
      - DATABASE_HOST=db
      - DATABASE_PORT=5432

      # ✅ 如果 Celery / Django import udp_sender（views 导入链触发），要给它同样的 msgbus 配置
      - MSG_BUS_BACKEND=redis
      - REDIS_STREAM_HOST=redis_stream
      - REDIS_STREAM_PORT=6379
      - REDIS_PACKET_STREAM_KEY=stream:udp:packets
      - REDIS_CMD_STREAM_KEY=stream:udp:cmd
      - REDIS_STREAM_MAXLEN=200000
    depends_on:
      redis:
        condition: service_healthy
      redis_stream:
        condition: service_healthy
      db:
        condition: service_started
      web:
        condition: service_started
    networks:
      - bt_nms_network
      - msgbus-net
    restart: unless-stopped

  celery-beat:
    #build:
    #  context: ./backend
    #  dockerfile: Dockerfile
    image: my_django:v5.2.15-py3.14
    container_name: bt_nms_celery_beat
    command: celery -A myproject beat --loglevel=info
    volumes:
      - ./backend:/app
      - ${DATA_DIR:-/srv/bt_nms_data}/cleanup_exports:/data/cleanup_exports
    environment:
      - DEBUG=True
      - DJANGO_SETTINGS_MODULE=myproject.settings
      - DATA_DIR=/data
      - CELERY_BROKER_URL=redis://redis:6379/0
      - REDIS_HOST=redis
      - REDIS_PORT=6379

      - DATABASE_NAME=mydatabase
      - DATABASE_USER=myuser
      - DATABASE_PASSWORD=mypassword
      - DATABASE_HOST=db
      - DATABASE_PORT=5432

      # ✅ 同上：如果 beat import 链碰到 udp_sender，也给 msgbus 配置
      - MSG_BUS_BACKEND=redis
      - REDIS_STREAM_HOST=redis_stream
      - REDIS_STREAM_PORT=6379
      - REDIS_PACKET_STREAM_KEY=stream:udp:packets
      - REDIS_CMD_STREAM_KEY=stream:udp:cmd
      - REDIS_STREAM_MAXLEN=200000
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_started
      redis_stream:
        condition: service_healthy
      web:
        condition: service_started
    networks:
      - bt_nms_network
      - msgbus-net
    restart: unless-stopped

  vue:
    #build:
    #  context: ./frontend
    #  dockerfile: Dockerfile
    image: my_vue:dev
    container_name: bt_nms_vue_dev
    environment:
      - VITE_BT_PROXY_TARGET=http://bt-backend-gateway:8000
      - VITE_SY_PROXY_TARGET=http://sy-backend-gateway:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "38173:5173"
    command: npm run dev -- --host 0.0.0.0
    networks:
      - bt_nms_network
      - frontend_proxy
    restart: unless-stopped

  vue_https:
    image: nginxinc/nginx-unprivileged:1.31.2-alpine3.23@sha256:054e14f543eb688809d59ec2ad1644d1a61678e247c87a318ad605977eb37eaf
    container_name: bt_nms_vue_https_dev
    ports:
      - "38443:8443"
    volumes:
      - ./nginx/dev-frontend-https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      - vue
    networks:
      - bt_nms_network
    restart: unless-stopped

  nginx_https:
    image: nginxinc/nginx-unprivileged:1.31.2-alpine3.23@sha256:054e14f543eb688809d59ec2ad1644d1a61678e247c87a318ad605977eb37eaf
    container_name: bt_nms_nginx_https_dev
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      - web
    networks:
      - bt_nms_network
    restart: unless-stopped

  flower:
    profiles: ["observability"]
    image: bt_nms_flower:2.0.1-py3.14-slim
    build:
      context: ./deploy/flower
      dockerfile: Dockerfile
    container_name: bt_nms_flower
    ports:
      - "127.0.0.1:5555:5555"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      celery:
        condition: service_started
    networks:
      - bt_nms_network

  portainer:
    profiles: ["docker-admin"]
    image: portainer/portainer-ce:2.39.3-alpine@sha256:90ae993781c08a4dcd1f96c6547a072bb3f90b7ebd5e082d071ef1ad8a341373
    container_name: bt_nms_portainer
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - ${DOCKER_HOST_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - bt_nms_portainer_data:/data
    networks:
      - bt_nms_network
    restart: "no"

networks:
  bt_nms_network:
    driver: bridge
  msgbus-net:
    driver: bridge
  frontend_proxy:
    external: true
    name: bt_nms_frontend_proxy

volumes:
  bt_nms_postgres_data:
  bt_nms_portainer_data:
